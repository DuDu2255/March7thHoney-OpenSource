name: .NET

permissions:
  actions: write
  contents: write

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否发布?'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish win-x64
      run: dotnet publish Program\Program.csproj -c Release -o Release\win-x64 -r win-x64 --framework net10.0 -p:PublishSingleFile=true

    - name: Publish linux-x64
      run: dotnet publish Program\Program.csproj -c Release -o Release\linux-x64 -r linux-x64 --framework net10.0 -p:PublishSingleFile=true

    - name: Publish linux-arm64
      run: dotnet publish Program\Program.csproj -c Release -o Release\linux-arm64 -r linux-arm64 --framework net10.0 -p:PublishSingleFile=true

    - name: Cleanup PDBs
      shell: pwsh
      run: |
        $publishDirs = @(
            "Release\win-x64",
            "Release\linux-x64",
            "Release\linux-arm64"
        )
        foreach ($dir in $publishDirs) {
            Write-Host "Cleaning PDBs in $dir"
            Get-ChildItem -Path $dir -Filter *.pdb -Recurse | Remove-Item -Force
        }

    - name: Upload win-x64 Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: March7thHoney-win-x64
        path: Release\win-x64

    - name: Upload linux-x64 Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: March7thHoney-linux-x64
        path: Release\linux-x64

    - name: Upload linux-arm64 Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: March7thHoney-linux-arm64
        path: Release\linux-arm64

    - name: Fetch tags for version calculation
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
      run: git fetch --tags

    - name: Determine Release Version
      id: version
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
      shell: pwsh
      run: |
        $date = (Get-Date).ToString("yyyyMMdd")
        $prefix = "${date}v"
        $tags = git tag --list
        $maxSeq = 0
        foreach ($tag in $tags) {
            if ($tag -match "^${prefix}(\d+)$") {
                $seq = [int]$matches[1]
                if ($seq -gt $maxSeq) { $maxSeq = $seq }
            }
        }
        $version = "${prefix}$($maxSeq + 1)"
        Write-Host "Release version: $version"
        echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Zip artifacts for Release
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
      shell: pwsh
      run: |
        $platforms = @{
            "win-x64" = "March7thHoney-win-x64"
            "linux-x64" = "March7thHoney-linux-x64"
            "linux-arm64" = "March7thHoney-linux-arm64"
        }
        foreach ($platform in $platforms.Keys) {
            Compress-Archive -Path "Release\$platform" -DestinationPath "$($platforms[$platform]).zip" -Force
        }

    - name: Create GitHub Release and Upload Assets
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: ${{ steps.version.outputs.version }}
        body: |
          发布 ${{ steps.version.outputs.version }}
          平台:
          - Windows x64
          - Linux x64
          - Linux ARM64
        draft: false
        prerelease: false
        files: |
          March7thHoney-win-x64.zip
          March7thHoney-linux-x64.zip
          March7thHoney-linux-arm64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

